backend = "xrender";
vsync = true;

inactive-opacity = 0.95;
frame-opacity = 1.0;
inactive-opacity-override = false;

corner-radius = 6;
shadow = true;
shadow-radius = 8;
shadow-offset-x = -4;
shadow-offset-y = -4;
shadow-opacity = 0.4;

fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;

no-dnd-shadow = true;
no-dock-shadow = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;

use-damage = true;
glx-no-stencil = true;

wintypes:
{
  tooltip = { fade = true; shadow = false; opacity = 0.9; };
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.95; };
  dropdown_menu = { opacity = 0.95; };
};
