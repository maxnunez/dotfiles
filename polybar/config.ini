[colors]
bg = #0D1117
bg-alt = #161B22
surface = #21262D
fg = #E6EDF3
fg-dim = #8B949E
primary = #00B899
secondary = #A78BFA
red = #FF7B72
green = #7EE787
yellow = #E3B341
blue = #79C0FF
cyan = #56D4DD
magenta = #D2A8FF
outline = #30363D

[bar/main]
width = 100%
height = 30
offset-x = 0
offset-y = 0
radius = 0
fixed-center = true

background = ${colors.bg}
foreground = ${colors.fg}

line-size = 2
line-color = ${colors.primary}

border-size = 0
padding-left = 3
padding-right = 3
module-margin = 1.5

font-0 = Inter:size=11;2
font-1 = JetBrainsMono Nerd Font:size=14;3

modules-left = i3
modules-center = title
modules-right = cpu memory pulseaudio network date

cursor-click = pointer

[module/i3]
type = internal/i3
format = <label-state> <label-mode>
label-focused = %name%
label-focused-background = ${colors.primary}
label-focused-foreground = ${colors.bg}
label-focused-padding = 2
label-unfocused = %name%
label-unfocused-foreground = ${colors.fg-dim}
label-unfocused-padding = 2
label-visible = %name%
label-visible-foreground = ${colors.fg}
label-visible-padding = 2
label-urgent = %name%
label-urgent-background = ${colors.red}
label-urgent-foreground = ${colors.bg}
label-urgent-padding = 2
label-separator = 
separator = false
strip-wsnumbers = true

[module/title]
type = internal/xwindow
format = <label>
label = %title:0:40:...%
label-foreground = ${colors.fg}
label-maxlen = 40

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " 󰍛  "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%
label-foreground = ${colors.fg}
label-padding = 1

[module/memory]
type = internal/memory
interval = 3
format-prefix = " 󰂯  "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%
label-foreground = ${colors.fg}
label-padding = 1

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = true
interval = 5
format-volume = <label-volume> <bar-volume>
label-volume = %percentage%%
label-volume-foreground = ${colors.fg}
label-volume-padding = 1
bar-volume-width = 10
bar-volume-gradient = true
bar-volume-indicator = |
bar-volume-indicator-foreground = ${colors.primary}
bar-volume-fill = |
bar-volume-fill-foreground = ${colors.primary}
bar-volume-empty = |
bar-volume-empty-foreground = ${colors.surface}
format-muted-prefix = " 󰝟  "
format-muted-foreground = ${colors.primary}
label-muted = muted
label-muted-padding = 1

[module/network]
type = internal/network
interface-type = wireless
interval = 5
accumulate-stats = true
unknown-as-up = true
format-connected = <label-connected>
format-connected-prefix = " 󰤨  "
format-connected-prefix-foreground = ${colors.primary}
label-connected = %essid%
label-connected-padding = 1
format-disconnected = <label-disconnected>
format-disconnected-prefix = " 󰤭  "
format-disconnected-prefix-foreground = ${colors.primary}
label-disconnected = offline
label-disconnected-padding = 1

[module/date]
type = internal/date
interval = 1
date = %a %d %b  %H:%M
date-alt = %Y-%m-%d %H:%M:%S
label = %date%
label-foreground = ${colors.fg}

[settings]
screenchange-reload = true

[global/wm]
margin-top = 0
margin-bottom = 0
